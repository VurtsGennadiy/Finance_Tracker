<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE — Finance Tracker">Finance Tracker</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar-brand {
            font-weight: 600;
        }
        .card {
            border: none;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/accounts}">💰 Finance Tracker</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/accounts}">Счета</a>
            <a class="nav-link" th:href="@{/accounts/create}">Новый счёт</a>
            <span class="navbar-text text-light me-3" th:text="${username}">user</span>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-light btn-sm">Выйти</button>
            </form>
        </div>
    </div>
</nav>

<main class="container mb-5">
    <div layout:fragment="content">
        <!-- Содержимое страницы будет вставлено здесь -->
    </div>
</main>

<footer class="text-center text-muted py-3 border-top">
    <small>Finance Tracker &copy; 2026</small>
</footer>

<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
