<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE — Wallet Control">Wallet Control</title>
    <link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-wallet2 me-2"></i>Wallet Control
        </a>
        <div class="navbar-nav ms-auto">
            <div class="d-flex align-items-center flex-nowrap gap-2">
                <span class="navbar-text text-light me-2" th:text="${username}">user</span>
                <form th:action="@{/logout}" method="post" class="d-inline m-0">
                    <button type="submit" class="btn btn-outline-light btn-sm">Выйти</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<main class="container mb-5">
    <div layout:fragment="content">
        <!-- Содержимое страницы будет вставлено здесь -->
    </div>
</main>

<footer class="text-center text-muted py-3 border-top">
    <small class="d-flex flex-column">
        <span>2026 Wallet Control</span>
        <a href="mailto:walletcontrol@mail.ru" class="text-muted text-decoration-none">
            walletcontrol@mail.ru
        </a>
    </small>
</footer>

<div layout:fragment="scripts">
    <!-- Скрипты страниц будут вставлены здесь -->
</div>

<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>

</html>
