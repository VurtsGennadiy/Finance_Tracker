<!-- Flash Messages -->
<div th:fragment="flashMessages" class="row">
    <div class="col-12">
        <!-- Success -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle me-2"></i>
            <span th:text="${success}">Успех</span>
            <!-- Кнопка отмены последней транзакции -->
            <form th:if="${showUndoButton}" th:action="@{/transactions/recent/undo}" method="post" style="display: inline;" class="ms-3">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-sm btn-outline-secondary ms-2">Отменить</button>
            </form>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Info (Синий) -->
        <div th:if="${info}" class="alert alert-info alert-dismissible fade show" role="alert">
            <i class="bi bi-info-circle me-2"></i>
            <span th:text="${info}">Информация</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Warning (Желтый) -->
        <div th:if="${warning}" class="alert alert-warning alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle me-2"></i>
            <span th:text="${warning}">Предупреждение</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Validation Errors -->
        <div th:if="${validationErrors}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <ul class="mb-0">
                <li th:each="error : ${validationErrors}" th:text="${error}">Ошибка валидации</li>
            </ul>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Error (Красный) -->
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-x-circle me-2"></i>
            <span th:text="${error}">Ошибка</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>
</div>
