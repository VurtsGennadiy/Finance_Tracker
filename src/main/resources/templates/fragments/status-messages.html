<!-- Status Messages -->
<div th:fragment="statusWarnings" class="row">
    <div class="col-12">

        <!-- Отсутствие счетов -->
        <div th:if="${noAccountsInfo}"
             class="alert alert-info alert-dismissible fade show d-flex flex-wrap align-items-center gap-2"
             role="alert">

            <div class="align-items-center flex-nowrap">
                <i class="bi bi-info-circle me-2"></i>
                <span>Для начала работы нужно создать первый счёт.</span>
            </div>

            <a href="/accounts/create" class="btn btn-link alert-link p-0">Создать счёт</a>

            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Неподтвержденная почта -->
        <div th:if="${emailConfirmedWarning}"
             class="alert alert-warning alert-dismissible fade show d-flex flex-wrap align-items-center gap-2"
             role="alert">

            <div class="align-items-center flex-nowrap">
                <i class="bi bi-envelope-exclamation me-2"></i>
                <span>Пожалуйста, подтвердите ваш email. Некоторые функции приложения могут быть недоступны.</span>
            </div>

            <form th:action="@{/email-confirm/resend}" method="post" class="d-inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-link alert-link p-0">Отправить письмо повторно</button>
            </form>

            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

    </div>
</div>
