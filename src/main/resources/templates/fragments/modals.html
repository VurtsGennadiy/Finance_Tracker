<!-- Income Modal -->
<div th:fragment="incomeModal(accounts, incomeCategories, transactionCreateRequest)" class="modal fade" id="incomeModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Внести доход</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form th:action="@{/transactions/income}" th:method="POST" th:object="${transactionCreateRequest}">
                    <div class="mb-3">
                        <label class="form-label" for="incomeAccountId">Счёт</label>
                        <select class="form-select" id="incomeAccountId" th:field="*{accountId}" required>
                            <option th:each="selectedAccount : ${accounts}"
                                    th:value="${selectedAccount.id}"
                                    th:text="${selectedAccount.name}">
                                Название счёта
                            </option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="incomeAmount">Сумма</label>
                        <input th:field="*{amount}" type="number" step="0.01" class="form-control" id="incomeAmount" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="incomeCategory">Категория</label>
                        <select th:field="*{category}" class="form-select" id="incomeCategory" required>
                            <option value="">Выберите категорию</option>
                            <option th:each="category : ${incomeCategories}"
                                    th:value="${category.name()}"
                                    th:text="${category.displayName}">
                                Категория
                            </option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="incomeDescription">Комментарий</label>
                        <textarea th:field="*{description}" class="form-control"  id="incomeDescription" rows="2" maxlength="500"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="incomeDate">Дата транзакции</label>
                        <input th:field="*{transactionDate}" type="date" class="form-control"  id="incomeDate" required>
                    </div>
                    <button type="submit" class="btn btn-income w-100">Добавить доход</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Transfer Modal -->
<div th:fragment="transferModal(accounts, transferCreateRequest)" class="modal fade" id="transferModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Перевод между счетами</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form th:action="@{/transactions/transfer}" th:method="post" th:object="${transferCreateRequest}">
                    <div class="mb-3">
                        <label class="form-label" for="transferFromAccountId">Со счёта</label>
                        <select th:field="*{fromAccountId}" class="form-select" id="transferFromAccountId" required>
                            <option th:each="selectedAccount : ${accounts}"
                                    th:value="${selectedAccount.id}"
                                    th:text="${selectedAccount.name}">
                                Название счёта
                            </option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="transferToAccountId">На счёт</label>
                        <select th:field="*{toAccountId}" class="form-select" id="transferToAccountId" required>
                            <option th:each="selectedAccount : ${accounts}"
                                    th:value="${selectedAccount.id}"
                                    th:text="${selectedAccount.name}">
                                Название счёта
                            </option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="transferAmount">Сумма</label>
                        <input th:field="*{amount}" type="number" step="0.01" class="form-control" id="transferAmount" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="transferDescription">Комментарий</label>
                        <textarea th:field="*{description}" class="form-control" id="transferDescription" rows="2" maxlength="500"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="transferDate">Дата транзакции</label>
                        <input th:field="*{transactionDate}" type="date" class="form-control" id="transferDate" required>
                    </div>
                    <button type="submit" class="btn btn-transfer w-100">Перевести</button>
                </form>
            </div>
        </div>
    </div>
</div>
