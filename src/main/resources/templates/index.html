<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная</title>
    <link rel="stylesheet" th:href="@{/css/index.css}">
</head>
<body>
<div layout:fragment="content">

    <div class="container mt-4">
        <div th:insert="~{fragments/status-messages :: statusWarnings}"></div>
        <div th:insert="~{fragments/flash-messages :: flashMessages}"></div>

        <!-- Summary cards -->
        <div class="row mb-4">

            <!-- Левая карточка: средства и активы -->
            <div class="col-12 col-md-6 mb-3 mb-md-0">
                <div class="card h-100">
                    <div class="card-body d-flex flex-column justify-content-center">
                        <div class="d-flex justify-content-between align-items-baseline mb-2">
                            <h6 class="text-muted mb-2">Доступные средства</h6>
                            <strong>
                                <span th:text="${#numbers.formatDecimal(data.availableBalance, 1, 'WHITESPACE', 2, 'COMMA')}">0,00</span> ₽
                            </strong>
                        </div>
                        <div class="d-flex justify-content-between align-items-baseline">
                            <h6 class="text-muted mb-2">Общий баланс</h6>
                            <strong>
                                <span th:text="${#numbers.formatDecimal(data.totalBalance, 1, 'WHITESPACE', 2, 'COMMA')}">0,00</span> ₽
                            </strong>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Правая карточка: долги -->
            <div class="col-12 col-md-6">
                <div class="card h-100">
                    <div class="card-body d-flex flex-column justify-content-center">
                        <div class="d-flex justify-content-between align-items-baseline mb-2">
                            <h6 class="text-muted mb-2">Ваш долг</h6>
                            <strong class="text-danger">
                                <span th:text="${#numbers.formatDecimal(data.accountsPayable, 1, 'WHITESPACE', 2, 'COMMA')}">0,00</span> ₽
                            </strong>
                        </div>
                        <div class="d-flex justify-content-between align-items-baseline">
                            <h6 class="text-muted mb-2">Вам должны</h6>
                            <strong class="text-success">
                                <span th:text="${#numbers.formatDecimal(data.accountsReceivable, 1, 'WHITESPACE', 2, 'COMMA')}">0,00</span> ₽
                            </strong>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Quick Actions -->
        <div th:if="${not #lists.isEmpty(accountsList)}" class="row mb-4 justify-content-center">
            <div class="col-auto">
                <button class="btn quick-action-btn btn-income" data-bs-toggle="modal" data-bs-target="#incomeModal">
                    <i class="bi bi-arrow-down-circle fs-4 d-block mb-2"></i>
                    <span class="fw-semibold">Доход</span>
                </button>
            </div>
            <div class="col-auto">
                <button class="btn quick-action-btn btn-expense" data-bs-toggle="modal" data-bs-target="#expenseModal">
                    <i class="bi bi-arrow-up-circle fs-4 d-block mb-2"></i>
                    <span class="fw-semibold">Расход</span>
                </button>
            </div>
            <div class="col-auto">
                <button class="btn quick-action-btn btn-transfer" data-bs-toggle="modal" data-bs-target="#transferModal">
                    <i class="bi bi-arrow-left-right fs-4 d-block mb-2"></i>
                    <span class="fw-semibold">Перевод</span>
                </button>
            </div>
        </div>

        <!-- Recent Operations -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="section-title mb-0">
                        <i class="bi bi-clock-history me-2"></i>Последние операции
                    </h5>
                    <a href="/transactions" class="btn btn-sm btn-common">
                        <i class="bi bi-list me-1"></i>Все операции</a>
                </div>
                
                <div th:insert="~{fragments/transactions-list :: transactions-list(${data.recentTransactions})}"></div>
            </div>
        </div>

        <!-- My Accounts -->
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="section-title mb-0">
                        <i class="bi bi-credit-card me-2"></i>Мои счета
                    </h5>
                    <a th:href="@{/accounts/create}" class="btn btn-common">
                        <i class="bi bi-plus-circle me-1"></i>Новый счёт
                    </a>
                </div>


                <!-- Проверка: есть ли вообще какие-либо счета -->
                <div th:if="${!data.accounts.isEmpty()}">

                    <!-- Итерация по группам счетов -->
                    <div th:each="group : ${data.accounts}"
                         th:if="${not #lists.isEmpty(group.value)}"
                         class="mb-4">

                        <!-- Заголовок группы -->
                        <h6 class="text-muted mb-3 border-bottom pb-2 d-flex align-items-center">
                            <span th:text="${group.key.displayName}">Тип счёта</span>
                            <span class="badge bg-secondary ms-2" th:text="${#lists.size(group.value)}">0</span>
                        </h6>

                        <!-- Сетка счетов для данной группы -->
                        <div class="row g-3">
                            <div th:each="account : ${group.value}" class="col-md-6 col-lg-4">
                                <a th:href="@{/accounts/{id}(id=${account.id})}" class="text-decoration-none">
                                    <div class="bank-card">
                                        <!-- Название счёта -->
                                        <div class="mb-3">
                                            <div class="small opacity-75 mb-1">Название счёта</div>
                                            <div class="fs-5 fw-bold" th:text="${account.name}">Название счёта</div>
                                        </div>

                                        <!-- Текущий баланс -->
                                        <div>
                                            <div class="small opacity-75 mb-1">Текущий баланс</div>
                                            <h3 class="mb-0" th:text="${#numbers.formatDecimal(account.balance, 1, 'WHITESPACE', 2, 'COMMA')} + ' ₽'">0,00 ₽</h3>
                                        </div>
                                    </div>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Заглушка, если нет счетов -->
                <div th:if="${data.accounts.isEmpty()}" class="text-center py-5 text-muted bg-light rounded">
                    <i class="bi bi-wallet2 fs-1 d-block mb-3"></i>
                    <p class="mb-3">У вас пока нет счетов.</p>
                </div>
            </div>
        </div>

    </div>

    <!-- Modals -->
    <div th:if="${not #lists.isEmpty(accountsList)}">
        <div th:insert="~{fragments/modals :: incomeModal(${accountsList}, ${incomeCategories}, ${transactionCreateRequest})}"></div>
        <div th:insert="~{fragments/modals :: expenseModal(${accountsList}, ${expenseCategories}, ${transactionCreateRequest})}"></div>
        <div th:insert="~{fragments/modals :: transferModal(${accountsList}, ${transferCreateRequest})}"></div>
    </div>
</div>

<div layout:fragment="scripts">
    <script th:src="@{/js/date-picker.js}"></script>
</div>

</body>
</html>
