<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Внутренняя ошибка сервера</title>
</head>
<body>

<div layout:fragment="content">
    <div class="container text-center py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="mb-4">
                    <h1 class="display-1 text-danger fw-bold">500</h1>
                    <h2 class="mb-3">Внутренняя ошибка сервера</h2>
                </div>

                <div class="alert alert-danger mb-4" role="alert">
                    <p class="mb-2">
                        К сожалению, произошла ошибка на сервере. Пожалуйста, попробуйте позже.
                    </p>
                    <p class="mb-0 text-muted small" th:if="${requestUrl}">
                        <strong>URL:</strong> <span th:text="${requestUrl}"></span>
                    </p>
                </div>

                <!-- Детали ошибки только для разработки -->
                <div th:if="${errorDetails}" class="alert alert-secondary mb-4" role="alert">
                    <p class="mb-1"><strong>Детали ошибки:</strong></p>
                    <code class="small text-break" th:text="${errorDetails}"></code>
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                    <a href="/" class="btn btn-primary btn-lg">
                        <i class="bi bi-house-door"></i> На главную
                    </a>
                    <a href="javascript:history.back()" class="btn btn-outline-secondary btn-lg">
                        <i class="bi bi-arrow-left"></i> Назад
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
