<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Ошибка запроса</title>
</head>
<body>

<div layout:fragment="content">
    <div class="container text-center py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="mb-4">
                    <h1 class="display-1 text-warning fw-bold">400</h1>
                    <h2 class="mb-3">Ошибка запроса</h2>
                </div>

                <div class="alert alert-warning mb-4" role="alert">
                    <p class="mb-2" th:if="${errorMessage}" th:text="${errorMessage}">
                        Запрос содержит ошибки
                    </p>
                    <p class="mb-0 text-muted small" th:if="${requestUrl}">
                        <strong>URL:</strong> <span th:text="${requestUrl}"></span>
                    </p>
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                    <a href="javascript:history.back()" class="btn btn-primary btn-lg">
                        <i class="bi bi-arrow-left"></i> Назад
                    </a>
                    <a href="/" class="btn btn-outline-secondary btn-lg">
                        <i class="bi bi-house-door"></i> На главную
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
