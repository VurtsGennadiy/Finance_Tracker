<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 Доступ запрещен</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>

<body>
    <div class="container text-center py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="mb-4">
                    <h1 class="display-1 text-danger fw-bold">403</h1>
                </div>

                <div class="alert alert-danger mb-4" role="alert">
                    <p class="mb-2">
                        <i class="bi bi-shield-lock-fill me-2"></i>
                        <span th:text="${errorMessage} ?: 'Доступ запрещен'">
                                Доступ запрещен
                        </span>
                    </p>
                </div>

                <!-- Детали ошибки только для разработки -->
                <div th:if="${errorDetails}" class="alert alert-secondary mb-4" role="alert">
                    <details>
                        <summary class="alert-heading" style="cursor: pointer;">
                            Детали ошибки
                        </summary>
                        <code class="small text-break" th:text="${errorDetails}"></code>
                    </details>
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                    <a href="/" class="btn btn-primary btn-lg">
                        <i class="bi bi-house"></i> На главную
                    </a>
                    <a href="javascript:history.back()" class="btn btn-outline-secondary btn-lg">
                        <i class="bi bi-arrow-left"></i> Назад
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
