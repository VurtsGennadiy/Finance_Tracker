<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Пополнение счёта</title>
</head>
<body>

<div layout:fragment="content">

    <!-- Навигация -->
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/accounts}">Мои счета</a></li>
            <li class="breadcrumb-item"><a th:href="@{/accounts/{id}(id=${account.id})}" th:text="${account.name}">Счёт</a></li>
            <li class="breadcrumb-item active">Пополнение</li>
        </ol>
    </nav>

    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">Пополнение счёта</h5>
                </div>
                <div class="card-body">
                    <!-- Информация о счёте -->
                    <div class="alert alert-info mb-4">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <strong th:text="${account.name}">Название счёта</strong>
                                <div class="small text-muted" th:text="${account.accountType.displayName}">Тип</div>
                            </div>
                            <h4 class="mb-0 text-success" th:text="${#numbers.formatDecimal(account.balance, 1, 2)} + ' ₽'">0.00 ₽</h4>
                        </div>
                    </div>

                    <!-- Сообщение об ошибке -->
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <!-- Форма пополнения -->
                    <form th:action="@{/accounts/{id}/income(id=${account.id})}" th:object="${request}" method="post">
                        
                        <!-- Сумма -->
                        <div class="mb-3">
                            <label for="amount" class="form-label">Сумма пополнения *</label>
                            <input type="number" 
                                   id="amount" 
                                   class="form-control" 
                                   th:field="*{amount}"
                                   step="0.01"
                                   placeholder="Введите сумму"
                                   required>
                            <div class="form-text">Минимальная сумма: 0.01 ₽</div>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></div>
                        </div>

                        <!-- Категория -->
                        <div class="mb-3">
                            <label for="category" class="form-label">Категория *</label>
                            <select id="category" 
                                    class="form-select" 
                                    th:field="*{category}"
                                    required>
                                <option value="">Выберите категорию</option>
                                <option th:each="cat : ${incomeCategories}"
                                        th:value="${cat.name()}"
                                        th:text="${cat.displayName}">Категория</option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
                        </div>

                        <!-- Описание -->
                        <div class="mb-4">
                            <label for="description" class="form-label">Описание</label>
                            <textarea id="description" 
                                      class="form-control" 
                                      th:field="*{description}"
                                      rows="3" 
                                      placeholder="Необязательно: комментарий к пополнению"
                                      maxlength="500"></textarea>
                        </div>

                        <!-- Кнопки -->
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success flex-grow-1">
                                <i class="bi bi-check-circle"></i> Пополнить счёт
                            </button>
                            <a th:href="@{/accounts/{id}(id=${account.id})}" class="btn btn-outline-secondary">
                                Отмена
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
