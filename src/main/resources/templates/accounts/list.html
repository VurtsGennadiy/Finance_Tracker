<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Мои счета</title>
</head>
<body>

<div layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1">Мои счета</h2>
        </div>
        <a th:href="@{/accounts/create}" class="btn btn-primary">+ Добавить новый счёт</a>
    </div>

    <!-- Уведомление об успехе -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Список счетов -->
    <div th:if="${#lists.isEmpty(accounts)}" class="text-center py-5">
        <p class="text-muted fs-5">У вас пока нет счетов</p>
    </div>

    <div class="row g-3" th:unless="${#lists.isEmpty(accounts)}">
        <div class="col-md-6 col-lg-4" th:each="account : ${accounts}">
            <div class="card h-100">
                <a th:href="@{/accounts/{id}(id=${account.id})}" class="text-decoration-none text-dark">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h5 class="card-title mb-0" th:text="${account.name}">Название</h5>
                            <span class="badge"
                                  th:classappend="${account.accountType.name() == 'BANK' ? 'bg-primary' :
                                                  (account.accountType.name() == 'CARD' ? 'bg-success' : 'bg-secondary')}"
                                  th:text="${account.accountType.displayName}">
                            </span>
                        </div>

                        <h3 class="text-success mb-3" th:text="${#numbers.formatDecimal(account.balance, 1, 2)} + ' ₽'">
                            0.00 ₽
                        </h3>

                        <ul class="list-unstyled small text-muted mb-0">
                            <li th:if="${account.accountType.name() == 'BANK' or account.accountType.name() == 'CARD'}">
                                <strong>Банк:</strong>
                                <span th:text="${account.bankName}">Bank</span>
                            </li>
                            <li th:if="${account.accountType.name() == 'BANK'}">
                                <strong>Номер счёта:</strong>
                                <span th:text="${account.accountNumber}">0000</span>
                            </li>
                            <li th:if="${account.accountType.name() == 'CARD'}">
                                <strong>Номер карты:</strong>
                                <span th:text="${account.cardNumber}">0000</span>
                            </li>
                            <li th:if="${account.accountType.name() == 'CARD'}">
                                <strong>Тип карты:</strong>
                                <span th:text="${account.cardType}">DEBIT</span>
                            </li>
                            <li th:if="${account.accountType.name() == 'CARD' and account.creditLimit != null}">
                                <strong>Кредитный лимит:</strong>
                                <span th:text="${#numbers.formatDecimal(account.creditLimit, 1, 2)} + ' ₽'">0 ₽</span>
                            </li>
                        </ul>
                    </div>
                </a>
            </div>
        </div>
    </div>

</div>
</body>
</html>
