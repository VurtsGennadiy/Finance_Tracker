<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Создать счёт</title>
</head>
<body>

<div layout:fragment="content">

    <div class="mb-4">
        <a th:href="@{/}" class="text-decoration-none">&larr; Вернуться на главную</a>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card">
                <div class="card-body p-4">
                    <h3 class="card-title mb-4">Создать новый счёт</h3>

                    <!-- Общая ошибка -->
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <form th:action="@{/accounts/create}" th:object="${request}" method="post" id="accountForm">

                        <!-- Тип счёта -->
                        <div class="mb-3">
                            <label for="accountType" class="form-label">Тип счёта *</label>
                            <select class="form-select" id="accountType" th:field="*{accountType}"
                                    th:classappend="${#fields.hasErrors('accountType')} ? 'is-invalid'"
                                    onchange="toggleFields()">
                                <option th:each="accountType : ${accountTypes}"
                                        th:value="${accountType.name()}"
                                        th:text="${accountType.displayName}">
                                    Тип счёта
                                </option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('accountType')}" th:errors="*{accountType}"></div>
                        </div>

                        <!-- Название -->
                        <div class="mb-3">
                            <label for="name" class="form-label">Название счёта *</label>
                            <input type="text" class="form-control" id="name" th:field="*{name}"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                                   placeholder="Название счёта" oninput="nameManuallyEdited = true">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <!-- Название банка (Типы счёта: BANK, DEBIT_CARD, CREDIT_CARD -->
                        <div id="bankNameField" style="display: none;">
                            <div class="mb-3">
                                <label for="bankName" class="form-label">Название банка *</label>
                                <input type="text" class="form-control" id="bankName" th:field="*{bankName}"
                                       th:classappend="${#fields.hasErrors('bankName') or #fields.hasErrors('bankNameValid')} ? 'is-invalid'"
                                       placeholder="Например: Сбербанк" oninput="updateName()">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('bankName')}" th:errors="*{bankName}"></div>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('bankNameValid')}" th:errors="*{bankNameValid}"></div>
                            </div>
                        </div>

                        <!-- Баланс -->
                        <div class="mb-3">
                            <label for="balance" class="form-label">Начальный баланс</label>
                            <input type="number" step="0.01" class="form-control" id="balance" th:field="*{balance}"
                                   th:classappend="${#fields.hasErrors('balance')} ? 'is-invalid'"
                                   placeholder="0.00">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('balance')}" th:errors="*{balance}"></div>
                        </div>

                        <!-- Кредитный лимит (Тип счёта: CREDIT_CARD) -->
                        <div class="mb-3" id="creditLimitField" style="display: none;">
                            <label for="creditLimit" class="form-label">Кредитный лимит</label>
                            <input type="number" step="0.01" class="form-control" id="creditLimit"
                                   th:field="*{creditLimit}"
                                   th:classappend="${#fields.hasErrors('creditLimit')} ? 'is-invalid'"
                                   placeholder="0.00">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('creditLimit')}" th:errors="*{creditLimit}"></div>
                        </div>

                        <!-- Номер счёта (Тип счёта: BANK) -->
                        <div id="accountNumberField" style="display: none;">
                            <div class="mb-3">
                                <label for="accountNumber" class="form-label">Номер счёта. Можно ввести номер целиком или его часть, или вообще не заполнять</label>
                                <input type="text" class="form-control" id="accountNumber" th:field="*{accountNumber}"
                                       placeholder="0000000000000000">
                            </div>
                        </div>

                        <!-- Номер карты (Типы счёта: DEBIT_CARD и CREDIT_CARD) -->
                        <div id="cardNumberField" style="display: none;">
                            <div class="mb-3">
                                <label for="cardNumber" class="form-label">Номер карты. Можно ввести номер целиком или его часть, или вообще не заполнять</label>
                                <input type="text" class="form-control" id="cardNumber" th:field="*{cardNumber}"
                                       placeholder="0000000000000000">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mt-2">Создать счёт</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        let nameManuallyEdited = false;

        function updateName() {
            if (nameManuallyEdited) return;

            const selectType = document.getElementById('accountType');
            const typeDisplayName = selectType.options[selectType.selectedIndex].text;

            const bankName = document.getElementById('bankName').value;
            const nameField = document.getElementById('name');

            if (bankName) {
                nameField.value = typeDisplayName + ' ' + bankName;
            } else {
                nameField.value = typeDisplayName;
            }
        }

        function toggleFields() {
            const divBankNameField = document.getElementById('bankNameField');
            const divAccountNumberField = document.getElementById('accountNumberField');
            const divCardNumberField = document.getElementById('cardNumberField');
            const divCreditLimitField = document.getElementById('creditLimitField');

            const type = document.getElementById('accountType').value;

            divBankNameField.style.display = (type === 'BANK' || type === 'DEBIT_CARD' || type === 'CREDIT_CARD') ? 'block' : 'none';
            divAccountNumberField.style.display = (type === 'BANK') ? 'block' : 'none';
            divCardNumberField.style.display = (type === 'DEBIT_CARD' || type === 'CREDIT_CARD') ? 'block' : 'none';
            divCreditLimitField.style.display = (type === 'CREDIT_CARD') ? 'block' : 'none';

            // Сбрасываем флаг ручного редактирования при смене типа счёта
            nameManuallyEdited = false;
            updateName();
        }

        // Инициализация при загрузке страницы
        toggleFields();
    </script>

</div>
</body>
</html>
