<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Создать счёт</title>
</head>
<body>

<div layout:fragment="content">

    <div class="mb-4">
        <a th:href="@{/accounts}" class="text-decoration-none">&larr; Вернуться к списку счетов</a>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card">
                <div class="card-body p-4">
                    <h3 class="card-title mb-4">Создать новый счёт</h3>

                    <!-- Общая ошибка -->
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <form th:action="@{/accounts/create}" th:object="${request}" method="post" id="accountForm">

                        <!-- Тип счёта -->
                        <div class="mb-3">
                            <label for="accountType" class="form-label">Тип счёта *</label>
                            <select class="form-select" id="accountType" th:field="*{accountType}"
                                    th:classappend="${#fields.hasErrors('accountType')} ? 'is-invalid'"
                                    onchange="toggleFields()">
                                <option value="">— Выберите тип —</option>
                                <option value="CASH">Наличные</option>
                                <option value="BANK">Банковский счёт</option>
                                <option value="CARD">Банковская карта</option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('accountType')}" th:errors="*{accountType}"></div>
                        </div>

                        <!-- Название -->
                        <div class="mb-3">
                            <label for="name" class="form-label">Название счёта *</label>
                            <input type="text" class="form-control" id="name" th:field="*{name}"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                                   placeholder="Название счёта" oninput="nameManuallyEdited = true">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <!-- Баланс -->
                        <div class="mb-3">
                            <label for="balance" class="form-label">Начальный баланс</label>
                            <input type="number" step="0.01" class="form-control" id="balance" th:field="*{balance}"
                                   th:classappend="${#fields.hasErrors('balance')} ? 'is-invalid'"
                                   placeholder="0.00">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('balance')}" th:errors="*{balance}"></div>
                        </div>

                        <!-- Поля для BANK -->
                        <div id="bankFields" style="display: none;">
                            <div class="mb-3">
                                <label for="bankNameBank" class="form-label">Название банка *</label>
                                <input type="text" class="form-control" id="bankNameBank" th:field="*{bankName}"
                                       th:classappend="${#fields.hasErrors('bankName') or #fields.hasErrors('bankNameValid')} ? 'is-invalid'"
                                       placeholder="Например: Сбербанк" oninput="updateName()">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('bankName')}" th:errors="*{bankName}"></div>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('bankNameValid')}" th:errors="*{bankNameValid}"></div>
                            </div>
                            <div class="mb-3">
                                <label for="accountNumber" class="form-label">Номер счёта</label>
                                <input type="text" class="form-control" id="accountNumber" th:field="*{accountNumber}"
                                       placeholder="0000000000000000">
                            </div>
                        </div>

                        <!-- Поля только для CARD -->
                        <div id="cardFields" style="display: none;">
                            <div class="mb-3">
                                <label for="bankNameCard" class="form-label">Название банка *</label>
                                <input type="text" class="form-control" id="bankNameCard" th:field="*{bankName}"
                                       th:classappend="${#fields.hasErrors('bankName') or #fields.hasErrors('bankNameValid')} ? 'is-invalid'"
                                       placeholder="Например: Сбербанк" oninput="updateName()">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('bankName')}" th:errors="*{bankName}"></div>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('bankNameValid')}" th:errors="*{bankNameValid}"></div>
                            </div>
                            <div class="mb-3">
                                <label for="cardNumber" class="form-label">Номер карты</label>
                                <input type="text" class="form-control" id="cardNumber" th:field="*{cardNumber}"
                                       placeholder="0000 0000 0000 0000">
                            </div>
                            <div class="mb-3">
                                <label for="cardType" class="form-label">Тип карты</label>
                                <select class="form-select" id="cardType" th:field="*{cardType}">
                                    <option th:each="ct : ${cardTypes}" th:value="${ct.name}" th:text="${ct.displayName}">DEBIT</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="creditLimit" class="form-label">Кредитный лимит</label>
                                <input type="number" step="0.01" class="form-control" id="creditLimit"
                                       th:field="*{creditLimit}"
                                       th:classappend="${#fields.hasErrors('creditLimit')} ? 'is-invalid'"
                                       placeholder="0.00">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('creditLimit')}" th:errors="*{creditLimit}"></div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mt-2">Создать счёт</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        const typeNames = {
            'CASH': 'Наличные',
            'BANK': 'Банковский счёт',
            'CARD': 'Банковская карта'
        };

        let nameManuallyEdited = false;

        function updateName() {
            if (nameManuallyEdited) return;

            const type = document.getElementById('accountType').value;
            const typeName = typeNames[type] || '';
            const bankName = (document.getElementById('bankNameBank').value
                           || document.getElementById('bankNameCard').value).trim();
            const nameField = document.getElementById('name');

            if (!type) {
                nameField.value = '';
            } else if (bankName) {
                nameField.value = typeName + ' ' + bankName;
            } else {
                nameField.value = typeName;
            }
        }

        function toggleFields() {
            const type = document.getElementById('accountType').value;
            const bankDiv = document.getElementById('bankFields');
            const cardDiv = document.getElementById('cardFields');

            bankDiv.style.display = (type === 'BANK') ? 'block' : 'none';
            cardDiv.style.display = (type === 'CARD') ? 'block' : 'none';

            // Отключаем поля в скрытых секциях, чтобы не отправлялись лишние данные
            bankDiv.querySelectorAll('input, select').forEach(el => el.disabled = (type !== 'BANK'));
            cardDiv.querySelectorAll('input, select').forEach(el => el.disabled = (type !== 'CARD'));

            // Сбрасываем флаг ручного редактирования при смене типа счёта
            nameManuallyEdited = false;
            updateName();
        }

        // Инициализация при загрузке страницы
        toggleFields();
    </script>

</div>
</body>
</html>
