<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Перевод между счетами</title>
</head>
<body>

<div layout:fragment="content">

    <!-- Навигация -->
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/accounts}">Мои счета</a></li>
            <li class="breadcrumb-item"><a th:href="@{/accounts/{id}(id=${account.id})}" th:text="${account.name}">Счёт</a></li>
            <li class="breadcrumb-item active">Перевод</li>
        </ol>
    </nav>

    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">Перевод на другой счёт</h5>
                </div>
                <div class="card-body">
                    <!-- Информация о счёте-источнике -->
                    <div class="alert alert-info mb-4">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <strong th:text="${account.name}">Название счёта</strong>
                                <div class="small text-muted" th:text="${account.accountType.displayName}">Тип</div>
                            </div>
                            <h4 class="mb-0 text-success" th:text="${#numbers.formatDecimal(account.balance, 1, 2)} + ' ₽'">0.00 ₽</h4>
                        </div>
                    </div>

                    <!-- Сообщение об ошибке -->
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <!-- Форма перевода -->
                    <form th:action="@{/accounts/{id}/transfer(id=${account.id})}" th:object="${request}" method="post">

                        <!-- Счёт-источник (скрытое поле) -->
                        <input type="hidden" th:field="*{fromAccountId}">

                        <!-- Сумма -->
                        <div class="mb-3">
                            <label for="amount" class="form-label">Сумма перевода *</label>
                            <input type="number"
                                   id="amount"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('amount')} ? 'is-invalid'"
                                   th:field="*{amount}"
                                   step="0.01"
                                   placeholder="Введите сумму"
                                   required>
                            <div class="form-text">Минимальная сумма: 0.01 ₽</div>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></div>
                        </div>

                        <!-- Счёт назначения -->
                        <div class="mb-3">
                            <label for="toAccountId" class="form-label">Счёт назначения *</label>
                            <select id="toAccountId"
                                    class="form-select"
                                    th:classappend="${#fields.hasErrors('toAccountId')} ? 'is-invalid'"
                                    th:field="*{toAccountId}"
                                    required>
                                <option value="">Выберите счёт</option>
                                <option th:each="acc : ${otherAccounts}"
                                        th:value="${acc.id}"
                                        th:text="${acc.name}">Счёт</option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('toAccountId')}" th:errors="*{toAccountId}"></div>
                        </div>

                        <!-- Описание -->
                        <div class="mb-4">
                            <label for="description" class="form-label">Описание</label>
                            <textarea id="description"
                                      class="form-control"
                                      th:field="*{description}"
                                      rows="3"
                                      placeholder="Необязательно: комментарий к переводу"
                                      maxlength="500"></textarea>
                        </div>

                        <!-- Кнопки -->
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary flex-grow-1">
                                <i class="bi bi-arrow-left-right"></i> Выполнить перевод
                            </button>
                            <a th:href="@{/accounts/{id}(id=${account.id})}" class="btn btn-outline-secondary">
                                Отмена
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
