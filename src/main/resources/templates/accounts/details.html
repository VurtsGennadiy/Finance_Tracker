<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${account.name}">Счёт - Wallet Control</title>
    <link rel="stylesheet" th:href="@{/css/account_details.css}">
</head>
<body>
<div layout:fragment="content">

    <div class="container mt-4">
        <div th:insert="~{fragments/flash-messages :: flashMessages}"></div>

        <!-- Верхний блок: карточка счёта + кнопки действий -->
        <div class="row g-3 align-items-stretch justify-content-center">

            <!-- Карточка счёта -->
            <div class="col-lg-6">
                <div class="account-card">
                    <div>
                        <div class="d-flex justify-content-between align-items-start">
                            <div class="account-name" th:text="${account.name}">Название счёта</div>
                            <i class="bi bi-credit-card-2-front fs-2 opacity-75"></i>
                        </div>

                        <div class="account-balance">
                            <span th:text="${#numbers.formatDecimal(account.balance, 1, 'WHITESPACE', 2, 'COMMA')}">0,00</span> ₽
                        </div>
                    </div>

                    <div class="account-info-row">
                        <div th:if="${account.accountType.name() == 'BANK' or account.accountType.name() == 'CARD'}" class="account-info-item">
                            <div class="account-info-label">Банк</div>
                            <div class="account-info-value" th:text="${account.bankName}">Название банка</div>
                        </div>
                        <div th:if="${account.accountType.name() == 'CARD'}" class="account-info-item">
                            <div class="account-info-label" th:text="${account.cardType.displayName + ' карта'}">Номер карты</div>
                            <div class="account-info-value" th:text="${account.cardNumber}">0000000000</div>
                        </div>
                        <div th:if="${account.accountType.name() == 'BANK'}" class="account-info-item">
                            <div class="account-info-label">Номер счёта</div>
                            <div class="account-info-value" th:text="${account.accountNumber}">0000000000</div>
                        </div>
                        <div th:if="${account.accountType.name() == 'CARD' and account.cardType.name() == 'CREDIT'}" class="account-info-item">
                            <div class="account-info-label">Кредитный лимит</div>
                            <div class="account-info-value">
                                <span th:if="${account.creditLimit != null}">
                                    <span th:text="${#numbers.formatDecimal(account.creditLimit, 1, 'WHITESPACE', 2, 'COMMA')}">0,00</span> ₽
                                </span>
                                <span th:unless="${account.creditLimit != null}">—</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Правая колонка: операции + управление -->
            <div class="col-lg-5">
                <div class="row g-3">
                    <!-- Блок операций (доход/расход/перевод) -->
                    <div class="col-12 col-md-7">
                        <div class="operations-card">
                            <div class="operations-card-header">
                                <i class="bi bi-wallet2"></i>
                                <span>Записать операцию</span>
                            </div>
                            <div class="operations-card-body">
                                <button class="operation-btn btn-income" data-bs-toggle="modal" data-bs-target="#incomeModal">
                                    <i class="bi bi-arrow-down-circle"></i>
                                    <span class="fw-semibold">Доход</span>
                                </button>
                                <button class="operation-btn btn-expense" data-bs-toggle="modal" data-bs-target="#expenseModal">
                                    <i class="bi bi-arrow-up-circle"></i>
                                    <span class="fw-semibold">Расход</span>
                                </button>
                                <button class="operation-btn btn-transfer" data-bs-toggle="modal" data-bs-target="#transferModal">
                                    <i class="bi bi-arrow-left-right"></i>
                                    <span class="fw-semibold">Перевод</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Блок управления счётом -->
                    <div class="col-12 col-md-5">
                        <div class="management-card">
                            <div class="management-card-header">
                                <i class="bi bi-gear"></i>
                                <span>Управление счётом</span>
                            </div>
                            <div class="management-card-body">
                                <button hidden class="management-btn share" data-bs-toggle="modal" data-bs-target="#shareModal">
                                    <i class="bi bi-share"></i>
                                    Поделиться счётом
                                </button>
                                <button class="management-btn delete" data-bs-toggle="modal" data-bs-target="#deleteModal">
                                    <i class="bi bi-trash"></i>
                                    Удалить счёт
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Recent Operations -->
        <div class="row mb-4" style="margin-top: 20px;">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="section-title mb-0">
                        <i class="bi bi-clock-history me-2"></i>Последние операции
                    </h5>
                    <a href="/transactions" class="btn btn-sm btn-common">
                        <i class="bi bi-list me-1"></i>Все операции</a>
                </div>

                <div th:insert="~{fragments/transactions-list :: transactions-list(${transactions})}"></div>
            </div>
        </div>

    </div>

    <!-- Modals -->
    <!-- Модальное окно подтверждения удаления -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteModalLabel">Подтверждение удаления</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                </div>
                <div class="modal-body">
                    <p>Вы уверены, что хотите удалить счёт <strong th:text="${account.name}"></strong> и все связанные с ним данные?</p>
                    <p class="text-danger mb-0">Это действие необратимо.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <form th:action="@{/accounts/{id}/delete(id=${account.id})}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-danger">Удалить</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:insert="~{fragments/modals :: incomeModal(${accounts}, ${incomeCategories}, ${transactionCreateRequest})}"></div>
    <div th:insert="~{fragments/modals :: expenseModal(${accounts}, ${expenseCategories}, ${transactionCreateRequest})}"></div>
    <div th:insert="~{fragments/modals :: transferModal(${accounts}, ${transferCreateRequest})}"></div>
</div>

<div layout:fragment="scripts">
    <script th:src="@{/js/date-picker.js}"></script>
</div>

</body>
</html>
