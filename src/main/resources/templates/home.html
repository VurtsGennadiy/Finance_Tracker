<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet Control - Главная</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f5f7fa;
            padding-bottom: 80px;
        }
        
        .total-balance {
            font-size: 2.5rem;
            font-weight: bold;
            color: #2c3e50;
        }
        
        .quick-action-btn {
            height: 120px;
            font-size: 1.1rem;
            border: none;
            transition: all 0.3s;
        }
        
        .quick-action-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .quick-action-btn.income {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .quick-action-btn.expense {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        
        .quick-action-btn.transfer {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }
        
        .bank-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            padding: 20px;
            min-height: 180px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .bank-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
        }

        .operation-item {
            border-left: 4px solid #dee2e6;
            transition: all 0.3s;
        }
        
        .operation-item:hover {
            background-color: #f8f9fa;
            border-left-color: #667eea;
        }
        

        .section-title {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 1rem;
        }
        
        @media (max-width: 768px) {
            .total-balance {
                font-size: 2rem;
            }
            
            .quick-action-btn {
                height: 100px;
                font-size: 1rem;
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>
<div layout:fragment="content">

    <div class="container mt-4">
        
        <!-- Flash Messages -->
        <div class="row mb-3">
            <div class="col-12">
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle me-2"></i>
                    <span th:text="${success}">Успех</span>
                    <!-- Кнопка отмены последней транзакции -->
                    <form th:if="${showUndoButton}" th:action="@{/home/recent/undo}" method="post" style="display: inline;" class="ms-3">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-sm btn-outline-secondary ms-2">Отменить</button>
                    </form>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                
                <!-- Validation Errors -->
                <div th:if="${validationErrors}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <ul class="mb-0">
                        <li th:each="error : ${validationErrors}" th:text="${error}">Ошибка валидации</li>
                    </ul>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                
                <div th:if="${error} and ${#lists.isEmpty(validationErrors)}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-x-circle me-2"></i>
                    <span th:text="${error}">Ошибка</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            </div>
        </div>
        
        <!-- Total Balance -->
        <div class="row mb-4">
            <div class="col-12 text-center">
                <h6 class="text-muted mb-2">Общий баланс</h6>
                <div class="total-balance">
                    <span th:text="${#numbers.formatDecimal(totalBalance, 1, 2)}">0,00</span> ₽
                </div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="row mb-4 g-3">
            <div class="col-4">
                <button class="btn quick-action-btn income w-100" data-bs-toggle="modal" data-bs-target="#incomeModal">
                    <i class="bi bi-arrow-down-circle fs-1 d-block mb-2"></i>
                    Доход
                </button>
            </div>
            <div class="col-4">
                <button class="btn quick-action-btn expense w-100" data-bs-toggle="modal" data-bs-target="#expenseModal">
                    <i class="bi bi-arrow-up-circle fs-1 d-block mb-2"></i>
                    Расход
                </button>
            </div>
            <div class="col-4">
                <button class="btn quick-action-btn transfer w-100" data-bs-toggle="modal" data-bs-target="#transferModal">
                    <i class="bi bi-arrow-left-right fs-1 d-block mb-2"></i>
                    Перевод
                </button>
            </div>
        </div>

        <!-- Recent Operations -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="section-title mb-0">
                        <i class="bi bi-clock-history me-2"></i>Последние операции
                    </h5>
                    <a href="/operations" class="btn btn-sm btn-outline-primary">Все операции</a>
                </div>
                
                <div class="card shadow-sm">
                    <div class="card-body p-0">
                        <div class="list-group list-group-flush">
                            <div th:each="operation : ${recentOperations}" class="list-group-item operation-item">
                                <div class="row align-items-center">
                                    <!-- Дата операции -->
                                    <div class="col-2">
                                        <div class="text-muted small" th:text="${#temporals.format(operation.transactionDate, 'dd.MM.yyyy')}">
                                            01.01.2026
                                        </div>
                                    </div>
                                    <!-- Категория и комментарий -->
                                    <div class="col-7">
                                        <div class="fw-bold"
                                             th:if="${operation.category != null}"
                                             th:classappend="${operation.category.incomeCategory ? 'text-success' : 'text-danger'}"
                                             th:text="${operation.category.displayName}">
                                            Категория
                                        </div>
                                        <div class="fw-bold"
                                             th:if="${operation.category == null}"
                                             th:classappend="text-info"
                                             th:text="${operation.type.displayName}">
                                            Перевод
                                        </div>
                                        <div class="text-muted small" th:text="${operation.description}">Описание</div>
                                    </div>
                                    <!-- Сумма и счёт -->
                                    <div class="col-3 text-end">
                                        <div class="fw-bold"
                                             th:classappend="${operation.type.name() == 'INCOME' or operation.type.name() == 'TRANSFER_IN' ? 'text-success' : 'text-danger'}"
                                             th:text="${(operation.type.name() == 'INCOME' or operation.type.name() == 'TRANSFER_IN' ? '+' : '-') + #numbers.formatDecimal(operation.amount, 1, 2) + ' ₽'}">
                                            -1 000,00 ₽
                                        </div>
                                        <div class="text-muted small" th:text="${operation.accountName}">
                                            Название счёта
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div th:if="${#lists.isEmpty(recentOperations)}" class="list-group-item text-center text-muted py-4">
                                <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                                Операций пока нет
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- My Accounts -->
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="section-title mb-0">
                        <i class="bi bi-credit-card me-2"></i>Мои счета
                    </h5>
                    <a th:href="@{/accounts/create}" class="btn btn-primary">
                        <i class="bi bi-plus-circle me-1"></i>Новый счёт
                    </a>
                </div>

                <div class="row g-3">
                    <div th:each="account : ${accounts}" class="col-md-6 col-lg-4">
                        <div class="bank-card">
                            <!-- Название счёта -->
                            <div class="mb-3">
                                <div class="small opacity-75 mb-1">Название счёта</div>
                                <div class="fs-5 fw-bold" th:text="${account.name}">Название счёта</div>
                            </div>

                            <!-- Текущий баланс -->
                            <div>
                                <div class="small opacity-75 mb-1">Текущий баланс</div>
                                <h3 class="mb-0" th:text="${#numbers.formatDecimal(account.balance, 1, 2) + ' ₽'}">0,00 ₽</h3>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Modals -->

    <!-- Income Modal -->
    <div class="modal fade" id="incomeModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Внести доход</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form action="/home/income" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <div class="mb-3">
                            <label class="form-label">Счёт</label>
                            <select class="form-select" name="accountId" required>
                                <option th:each="account : ${accounts}"
                                        th:value="${account.id}"
                                        th:text="${account.name}">
                                    Название счёта
                                </option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Сумма</label>
                            <input type="number" step="0.01" class="form-control" name="amount" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Категория</label>
                            <select class="form-select" name="category" required>
                                <option value="">Выберите категорию</option>
                                <option th:each="category : ${incomeCategories}"
                                        th:value="${category.name()}"
                                        th:text="${category.displayName}">
                                    Категория
                                </option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Комментарий</label>
                            <textarea class="form-control" name="description" rows="2" maxlength="500"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Дата транзакции</label>
                            <input type="date" class="form-control" name="transactionDate" id="incomeDate" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Добавить доход</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Expense Modal -->
    <div class="modal fade" id="expenseModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Внести расход</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form action="/home/expense" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <div class="mb-3">
                            <label class="form-label">Счёт</label>
                            <select class="form-select" name="accountId" required>
                                <option th:each="account : ${accounts}"
                                        th:value="${account.id}"
                                        th:text="${account.name}">
                                    Название счёта
                                </option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Сумма</label>
                            <input type="number" step="0.01" class="form-control" name="amount" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Категория</label>
                            <select class="form-select" name="category" required>
                                <option value="">Выберите категорию</option>
                                <option th:each="category : ${expenseCategories}"
                                        th:value="${category.name()}"
                                        th:text="${category.displayName}">
                                    Категория
                                </option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Комментарий</label>
                            <textarea class="form-control" name="description" rows="2" maxlength="500"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Дата транзакции</label>
                            <input type="date" class="form-control" name="transactionDate" id="expenseDate" required>
                        </div>
                        <button type="submit" class="btn btn-danger w-100">Добавить расход</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Transfer Modal -->
    <div class="modal fade" id="transferModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Перевод между счетами</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form action="/home/transfer" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <div class="mb-3">
                            <label class="form-label">Со счёта</label>
                            <select class="form-select" name="fromAccountId" required>
                                <option th:each="account : ${accounts}"
                                        th:value="${account.id}"
                                        th:text="${account.name}">
                                    Название счёта
                                </option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">На счёт</label>
                            <select class="form-select" name="toAccountId" required>
                                <option th:each="account : ${accounts}"
                                        th:value="${account.id}"
                                        th:text="${account.name}">
                                    Название счёта
                                </option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Сумма</label>
                            <input type="number" step="0.01" class="form-control" name="amount" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Комментарий</label>
                            <textarea class="form-control" name="description" rows="2" maxlength="500"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Дата транзакции</label>
                            <input type="date" class="form-control" name="transactionDate" id="transferDate" required>
                        </div>
                        <button type="submit" class="btn btn-info w-100">Перевести</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Фрагмент для скриптов -->
<div layout:fragment="scripts">
    <script>
        // Универсальная функция форматирования даты
        function getTodayFormatted() {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        document.getElementById('incomeModal').addEventListener('shown.bs.modal', function () {
            const incomeDateInput = document.getElementById('incomeDate');
            incomeDateInput.value = getTodayFormatted();
            incomeDateInput.max = getTodayFormatted();
        });

        document.getElementById('expenseModal').addEventListener('shown.bs.modal', function () {
            const expenseDateInput = document.getElementById('expenseDate');
            expenseDateInput.value = getTodayFormatted();
            expenseDateInput.max = getTodayFormatted();
        });

        document.getElementById('transferModal').addEventListener('shown.bs.modal', function () {
            const transferDateInput = document.getElementById('transferDate');
            transferDateInput.value = getTodayFormatted();
            transferDateInput.max = getTodayFormatted();
        });
    </script>
</div>

</body>
</html>
