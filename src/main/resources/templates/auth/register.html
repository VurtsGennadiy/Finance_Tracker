<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .register-card {
            width: 100%;
            max-width: 440px;
            border: none;
            box-shadow: 0 0.25rem 0.5rem rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

<div class="card register-card">
    <div class="card-body p-4">
        <div class="text-center mb-4">
            <h3 class="fw-bold">Wallet Control</h3>
            <p class="text-muted">Создайте новый аккаунт</p>
        </div>

        <!-- Ошибки бизнес-логики -->
        <div th:if="${errors}" class="alert alert-danger" role="alert">
            <ul class="mb-0 ps-3">
                <li th:each="error : ${errors}" th:text="${error}"></li>
            </ul>
        </div>

        <form th:action="@{/register}" th:object="${registerRequest}" method="post" novalidate>

            <div class="mb-3">
                <label for="username" class="form-label">Имя пользователя</label>
                <input type="text" class="form-control"
                       th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
                       id="username" th:field="*{username}"
                       placeholder="Введите логин" required autofocus>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control"
                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                       id="email" th:field="*{email}"
                       placeholder="Введите email" required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Пароль</label>
                <input type="password" class="form-control"
                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                       id="password" th:field="*{password}"
                       placeholder="Введите пароль" required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <div class="mb-3">
                <label for="confirmPassword" class="form-label">Подтвердите пароль</label>
                <input type="password" class="form-control"
                       th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                       id="confirmPassword" th:field="*{confirmPassword}"
                       placeholder="Повторите пароль" required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-3">Зарегистрироваться</button>
        </form>

        <div class="text-center">
            <span class="text-muted">Уже есть аккаунт?</span>
            <a th:href="@{/login}" class="text-decoration-none">Войти</a>
        </div>
    </div>
</div>

<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
