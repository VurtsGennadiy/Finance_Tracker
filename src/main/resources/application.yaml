spring:
  application:
    name: Wallet_Control

  web:
    error:
      whitelabel.enabled: false
      path: /error

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  liquibase:
    change-log: db/changelog/db.changelog-master.xml

  mail:
    host: smtp.mail.ru
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

logging:
  file:
    name: logs/${spring.application.name}.log
    logback:
      rollingpolicy:
        max-file-size: 10MB
        file-name-pattern: logs/${spring.application.name}-%d{yyyy-MM-dd}.%i.log
        max-history: 30