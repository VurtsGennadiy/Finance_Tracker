name: CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# Один деплой за раз: следующий запуск ждёт завершения предыдущего,
# чтобы на сервере не оказались одновременно две версии.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Тесты и сборка jar
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Установка JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Тесты и сборка
        run: |
          set -euo pipefail
          if [ -f .mvn/wrapper/maven-wrapper.properties ]; then
            chmod +x mvnw
            ./mvnw -B -ntp clean verify
          else
            echo "::warning::.mvn/wrapper/maven-wrapper.properties отсутствует в репозитории — используется mvn из образа runner"
            mvn -B -ntp clean verify
          fi

      - name: Сохранение jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: |
            target/*.jar
            !target/*.jar.original
          if-no-files-found: error
          retention-days: 5

  deploy:
    name: Деплой на сервер
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Получение jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: dist

      - name: Настройка SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          : "${SSH_PRIVATE_KEY:?Не задан секрет SSH_PRIVATE_KEY}"
          : "${SSH_HOST:?Не задан секрет SSH_HOST}"

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Копирование файлов на сервер
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          : "${SSH_USER:?Не задан секрет SSH_USER}"

          PORT="${SSH_PORT:-22}"
          DIR="${DEPLOY_PATH:-/opt/walletcontrol}"
          REMOTE="${SSH_USER}@${SSH_HOST}"
          JAR="$(find dist -maxdepth 1 -name '*.jar' ! -name '*.original' -print -quit)"
          test -n "$JAR" || { echo "::error::jar не найден в артефакте сборки"; exit 1; }

          SSH="ssh -p ${PORT} -i ${HOME}/.ssh/deploy_key -o BatchMode=yes"
          SCP="scp -P ${PORT} -i ${HOME}/.ssh/deploy_key -o BatchMode=yes"

          $SSH "$REMOTE" "mkdir -p '${DIR}' '${DIR}/target'"
          $SCP "$JAR" "$REMOTE:${DIR}/target/app.jar"
          $SCP Dockerfile docker-compose.yaml .dockerignore "$REMOTE:${DIR}/"
          $SCP scripts/remote-deploy.sh "$REMOTE:${DIR}/remote-deploy.sh"

      - name: Запуск деплоя
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          DIR="${DEPLOY_PATH:-/opt/walletcontrol}"

          ssh -p "$PORT" -i "$HOME/.ssh/deploy_key" -o BatchMode=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "cd '${DIR}' && APP_TAG='${{ github.sha }}' bash remote-deploy.sh"

          echo "### Деплой ${{ github.sha }} выполнен" >> "$GITHUB_STEP_SUMMARY"
